# Round-robin load balancer in front of the app replicas.
# "app" resolves (via Docker DNS) to every replica's IP, so nginx
# spreads requests across all of them.
events {
    worker_connections 4096;
}

http {
    # Log which instance handled each request, so the test can show
    # traffic really was spread across instances.
    log_format upstream '$upstream_addr $status';
    access_log /var/log/nginx/upstream.log upstream;

    upstream app {
        server app:8080;
        keepalive 128;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header X-Upstream $upstream_addr always;
        }
    }
}
